name: Profile metrics

# Renders the profile cards to SVGs committed in this repo, so the README
# serves static files instead of calling shared instances at page load.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Theo-Dawson
          filename: metrics/summary.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Denver
          config_display: large

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Theo-Dawson
          filename: metrics/calendar.svg
          base: ""
          config_timezone: America/Denver
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
