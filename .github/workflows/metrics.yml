name: Contribution chart

# Renders the chart to an SVG committed in this repo, so the README serves a
# static file instead of calling a shared instance at page load.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
      - .github/scripts/contribution_chart.py

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render chart
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/contribution_chart.py Theo-Dawson metrics/commits.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/commits.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Update contribution chart"
          git push
